<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b2a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-180.png"><link rel="stylesheet" href="css/app.css"><title>Belt Roll Calculator</title></head>
<body><div class="shell">
<aside id="sidebar"><div class="brand"><img src="assets/icons/icon-192.png" alt=""><div><b>Belt Roll Calculator</b><small>Web Edition 2.2 Beta<br>Build 2026.07.24.02</small></div></div><nav>
<button class="nav active" data-page="calculator" data-i="calculator"></button><button class="nav" data-page="inventory" data-i="inventory"></button><button class="nav" data-page="history" data-i="history"></button><button class="nav admin-nav" data-page="users" data-i="users"></button><button class="nav admin-nav" data-page="settings" data-i="settings"></button><button class="nav" data-page="about" data-i="about"></button></nav></aside>
<div id="scrim"></div><main><header><button id="menuBtn" aria-label="Menu">☰</button><div id="pageTitle">Calculator</div><div class="header-actions"><select id="lang"><option value="en">English</option><option value="zh">简体中文</option><option value="es">Español</option></select><button id="loginBtn"></button></div></header>
<section id="calculator" class="page active"><div class="page-grid calc-grid"><article class="panel"><h2 data-i="input"></h2>
<div class="field"><label data-i="units"></label><div class="seg"><button data-unit="MM">MM</button><button data-unit="IN">INCH</button></div></div>
<div class="field"><label for="thickness" data-i="thickness"></label><div class="input-unit"><input id="thickness" type="number" min="0" step="any"><span class="dimUnit">mm</span></div></div>
<div class="field"><label for="core" data-i="core"></label><div class="input-unit"><input id="core" type="number" min="0" step="any"><span class="dimUnit">mm</span></div></div>
<div class="field"><label data-i="calculateBy"></label><div class="seg"><button data-mode="od" data-i="outsideDiameter"></button><button data-mode="turns" data-i="turns"></button></div></div>
<div class="field"><label id="remainingLabel" for="remaining"></label><div class="input-unit"><input id="remaining" type="number" min="0" step="any"><span id="remainingUnit">mm</span></div></div>
<div class="field"><label for="beltSelect" data-i="beltOptional"></label><select id="beltSelect"></select></div><div id="selectedBeltStatus" class="muted"></div>
<div class="actions"><button id="useBeltThickness" data-i="useBeltThickness"></button><button id="clearBtn" data-i="clear"></button></div></article>
<article class="panel"><h2 data-i="result"></h2><div id="warn"></div><div class="result-grid"><div><span data-i="lengthMillimeters"></span><b id="valMM">—</b></div><div><span data-i="lengthMeters"></span><b id="valM">—</b></div><div><span data-i="lengthInches"></span><b id="valIN">—</b></div><div><span data-i="lengthFeet"></span><b id="valFT">—</b></div><div><span data-i="lengthYards"></span><b id="valYD">—</b></div><div><span data-i="estimatedTurns"></span><b id="turnsVal">—</b></div><div><span data-i="estimatedOD"></span><b id="odResultVal">—</b></div></div><div class="actions result-actions"><button id="copyBtn" data-i="copy"></button><button id="invActionBtn" class="primary" data-i="inventoryAction"></button></div></article></div></section>
<section id="inventory" class="page"><div id="summary" class="summary"></div><div class="page-grid inventory-grid"><article class="panel detail-panel"><h2 data-i="beltDetail"></h2><div id="beltDetail"></div></article><article class="panel list-panel"><h2 data-i="inventory"></h2><div class="toolbar"><input id="search" type="search" data-i-placeholder="searchAll"><button id="addBelt" class="primary admin-only" data-i="addBelt"></button></div><div class="toolbar"><button class="filter active" data-filter="all" data-i="all"></button><button class="filter" data-filter="low" data-i="lowStock"></button><button class="filter" data-filter="out" data-i="outOfStock"></button><select id="sort"><option value="name" data-i="sortName"></option><option value="stockAsc" data-i="sortStockAsc"></option><option value="stockDesc" data-i="sortStockDesc"></option><option value="modified" data-i="sortModified"></option></select></div><div id="beltList" class="scroll-list"></div></article></div></section>
<section id="history" class="page"><article class="panel full"><h2 data-i="history"></h2><div class="toolbar"><input id="historySearch" type="search" data-i-placeholder="searchHistory"><button id="exportHistory" data-i="exportCsv"></button></div><div id="historyList" class="scroll-list"></div></article></section>
<section id="users" class="page"><article class="panel full narrow"><h2 data-i="users"></h2><div class="toolbar"><button id="addUserBtn" class="primary" data-i="addUser"></button></div><div id="userList" class="scroll-list"></div></article></section>
<section id="settings" class="page"><article class="panel full narrow"><h2 data-i="settings"></h2><div class="setting"><span data-i="passwordProtection"></span><button id="protectionToggle"></button></div><hr><h3 data-i="dataBackup"></h3><div class="actions"><button id="exportBackup" data-i="exportBackup"></button><button id="importBackup" data-i="importBackup"></button><input id="backupFile" hidden type="file" accept=".json,application/json"></div></article></section>
<section id="about" class="page"><article class="panel about full"><h2 data-i="about"></h2><img id="aboutLogo" src="assets/logo/brc-logo.png" alt="Belt Roll Calculator"><h3>Belt Roll Calculator</h3><p>Web Edition 2.2 Beta</p><p>Build 2026.07.24.02</p><p data-i="localDataNote"></p><p>Designed and Developed by<br><b>Raymond Lei</b></p><p>Copyright © 2026 Raymond Lei<br>All Rights Reserved.</p></article></section>
</main></div><div id="toast"></div><div id="modal" class="modal" aria-hidden="true"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions" class="actions"></div></div></div><script type="module" src="js/app.js"></script></body></html>
